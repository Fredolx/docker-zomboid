name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: stable
            steam_branch: public
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Set image names
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PACKAGE=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Get game build id
        id: steam
        run: |
          buildid=$(docker run --rm docker.io/steamcmd/steamcmd:latest \
            +login anonymous +app_info_update 1 +app_info_print 380870 +quit \
            | awk -F'"' -v b="${{ matrix.steam_branch }}" '
                $2 == "branches" { s = 1 }
                s && $2 == b && NF == 3 { f = 1 }
                f && $2 == "buildid" && !p { print $4; p = 1 }')
          test -n "$buildid"
          echo "buildid=$buildid" >> "$GITHUB_OUTPUT"

      - name: Compare with latest image
        id: check
        run: |
          sha="${GITHUB_SHA::7}"
          latest=$(gh api --paginate "/users/${{ github.repository_owner }}/packages/container/$PACKAGE/versions" \
            --jq '.[].metadata.container.tags | select(any(. == "${{ matrix.branch }}")) | .[] | select(startswith("${{ matrix.branch }}-"))' \
            2>/dev/null | head -n1 || true)
          echo "latest=$latest"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "${{ matrix.branch }}-$sha-${{ steps.steam.outputs.buildid }}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.check.outputs.build == 'true'
        # The runner has ~14GB free; the game files are ~7GB and end up in both build stages plus the buildx cache.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.build == 'true'
        with:
          context: .
          push: true
          provenance: false
          build-args: STEAM_BRANCH=${{ matrix.steam_branch }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.branch }}
            ${{ env.IMAGE }}:${{ matrix.branch }}-${{ steps.check.outputs.sha }}-${{ steps.steam.outputs.buildid }}

      - name: Prune old versions
        if: steps.check.outputs.build == 'true'
        run: |
          gh api --paginate "/users/${{ github.repository_owner }}/packages/container/$PACKAGE/versions" \
            --jq '.[] | select(.metadata.container.tags | length > 0 and all(startswith("${{ matrix.branch }}-"))) | .id' \
          | while read -r id; do
              gh api -X DELETE "/users/${{ github.repository_owner }}/packages/container/$PACKAGE/versions/$id"
            done
